<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta
      name="description"
      content="IIT Bombay-Honeywell Centre of Excellence for Future Skills & Innovation IHCFSI"
    />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "IIT Bombay-Honeywell Centre of Excellence for Future Skills & Innovation | IHCFSI",
        "url": "ihcfsi.iitb.ac.in"
      }
    </script>

    <link
      rel="icon"
      type="image/png"
      href="./assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />



    <title>IHCFSI - Events</title>
    <!-- Mukta Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="events.css">

    <script src="index.js" defer></script>
</head>
<body>

    <!-- Header Navigation -->
    <!-- Header -->
    <div id="header-container"></div>
    <!-- Main Content Container -->
    <main class="container page-content">
        <div class="section-header">
            <h1 class="page-title">Our Events</h1>
            <p class="page-subtitle">Explore our hackathons, workshops, outreach programs, and dialogue series.</p>
        </div>

        <!-- 4 Filter Tabs (Hackathons, Workshop, Outreach, Dialogue Series) -->
        <div class="filter-container">
            <div class="filter-pill-switch" id="filterTabs">
                <button class="filter-btn active" data-filter="hackathon">Hackathons</button>
                <button class="filter-btn" data-filter="workshop">Workshop</button>
                <button class="filter-btn" data-filter="outreach">Outreach</button>
                <button class="filter-btn" data-filter="dialouge">Dialogue Series</button>
            </div>
        </div>

        <!-- Dynamic Events Grid -->
        <div class="events-grid" id="eventsGrid">
            <!-- Populated via JavaScript from events.json -->
        </div>

        <!-- Breadcrumb Navigation -->
    <nav class="breadcrumb-container" aria-label="Breadcrumb">
        <div class="container">
            <ol class="breadcrumb-list">
                <li><a href="index.html">Home</a></li>
                <li class="separator">/</li>
                <li><a href="#events" class="active-crumb">Events</a></li>
            </ol>
        </div>
    </nav>

    </main>

    <!-- Footer -->
<div id="footer-container"></div>


    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('events.json');
                const data = await response.json();
                const eventsGrid = document.getElementById('eventsGrid');
        const filterBtns = document.querySelectorAll('.filter-btn');

                let currentFilter = 'hackathon';

                function renderEvents(filterType) {
                    eventsGrid.innerHTML = '';
                    const filtered = data.events.filter(e => e.type === filterType);

                    if (filtered.length === 0) {
                        eventsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No events found in this category.</p>';
                        return;
                    }

                    filtered.forEach(event => {
                        const year = event.startDate ? event.startDate.split('-')[0] : '';
                        const imgSrc = event.image || 'https://images.unsplash.com/photo-1509391365360-2e959784a276?auto=format&fit=crop&w=600&q=80';
                        
                        const card = document.createElement('div');
                        card.className = 'event-card';
                        card.innerHTML = `
                            <div class="event-image-box">
                                <img src="${imgSrc}" alt="${event.title}">
                            </div>
                            <div class="event-info">
                                <div class="event-details">
                                    <h3>${event.title}</h3>
                                    <span class="event-year">${year}</span>
                                </div>
                                <a href="event_details.html?id=${event.id}" class="event-action-badge" title="View Details">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </a>
                            </div>
                        `;
                        eventsGrid.appendChild(card);
                    });
                }

                // Initial load
                renderEvents(currentFilter);

                // Filter Click listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                        currentFilter = btn.getAttribute('data-filter');
                        renderEvents(currentFilter);
                    });
                });

            } catch (err) {
                console.error('Error loading events.json:', err);
            }
        });
    </script>
</body>
</html>
